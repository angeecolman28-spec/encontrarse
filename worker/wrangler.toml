# Solo hace falta si se despliega con Wrangler desde la computadora.
# Desde el panel de Cloudflare estos valores se cargan a mano.
name = "encontrarse-sync"
main = "sync.js"
compatibility_date = "2026-01-01"

[triggers]
crons = ["*/30 * * * *"]

# El id se copia del panel: Storage & Databases -> KV
[[kv_namespaces]]
binding = "DISPO"
id = "PENDIENTE_ID_DEL_NAMESPACE"

# FEEDS, TELEGRAM_TOKEN, TELEGRAM_CHAT_ID y REFRESH_KEY van como secretos:
#   npx wrangler secret put FEEDS
# Nunca en este archivo.
